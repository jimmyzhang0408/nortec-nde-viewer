name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libegl1 libgl1
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile
        run: python -m py_compile nde_viewer.py tests/test_nde_viewer.py
      - name: Run unit tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -v
      - name: Smoke-test included sample
        env:
          QT_QPA_PLATFORM: offscreen
        run: >-
          python nde_viewer.py
          --smoke-test
          surface-cracks-eca-single-surf25-2026-07-13T04-54-27.nde
